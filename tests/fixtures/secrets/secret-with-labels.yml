services:
  foo:
    secrets:
      - file_secret
      - env_secret
      - ext_secret
      - named_secret

secrets:
  file_secret:
    file: ./foo/bar
    labels:
      com.example.foo: bar
  env_secret:
    environment: FOO_BAR
    labels:
      com.example.baz: qux
  ext_secret:
    external: true
    name: my_external_secret
    labels:
      com.example.secure: "true"
  named_secret:
    file: ./secret.txt
    name: custom_secret_name
    labels:
      com.example.named: "true"
